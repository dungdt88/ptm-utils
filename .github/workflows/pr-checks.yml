# Gate pull requests on lint and tests, BEFORE merge.
#
# NOTE: this workflow only *reports* until it is marked a required status check
# in Settings → Branches for master.
name: PR Checks

on:
  pull_request:
    branches:
      - master

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install ruff

      - name: Check formatting
        run: ruff format --check src tests

      - name: Lint
        run: ruff check .

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          pip install --upgrade pip
          pip install -e .
          pip install pytest

      - run: pytest
